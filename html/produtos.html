<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Controle de Produtos</title>
    <link rel="stylesheet" href="../css/alertas.css" />
    <link rel="stylesheet" href="../css/produtos.css" />
  </head>

  <body>
    <!-- TOPO DA PAGINA COM IDENTIFICAÇÃO DO SETOR DA COZINHA E CONFIGURAÇÕES DE DIRECIONAMENTO -->
    <header>
      <div class="titulo">
        <h1>Estoque de Produtos</h1>
        <h2>Setor da Cozinha</h2>
      </div>

      <div class="btn-header">
        <button class="btn-voltar" onclick="window.history.back()">Voltar</button>

        <button class="btn-sair" onclick="window.location.href='../index.html'" id="inicio">
          Sair
        </button>
      </div>
    </header>

    <!-- AREA PRINCIPAL COMPORTANDO METRICAS FILTROS E CONTEUDO DINAMICO -->
    <main>
      <!-- CAMPO DE ENTRADA RESTRITO PARA LOCALIZAÇÃO RAPIDA DE ITENS -->
      <section class="topo">
        <input type="text" id="pesquisa" placeholder="🔎 Pesquisar insumo..." />
      </section>

      <!-- INDICADORES RESUMIDOS DO STATUS OPERACIONAL DOS PRODUTOS -->
      <section class="resumo">
        <div class="box">
          <h3>Total Produtos</h3>

          <span id="totalProdutos"> 0 </span>
        </div>

        <div class="box">
          <h3>Ativos</h3>

          <span id="produtosAtivos"> 0 </span>
        </div>

        <div class="box">
          <h3>Inativos</h3>

          <span id="produtosInativos"> 0 </span>
        </div>
      </section>

      <!-- SEÇÃO RESTRITA ONDE O JAVASCRIPT INSERE A LISTAGEM EM FORMATO GRID -->
      <section id="listaProdutos" class="lista">
        <!-- CARDS CRIADOS PELO JAVASCRIPT -->
      </section>
    </main>

    <!-- JANELA FLUTUANTE MODAL PARA SUPORTE A CADASTROS E EDICOES DE MERCADORIAS -->
    <div id="modal" class="modal">
      <div class="modal-conteudo">
        <h2 id="tituloModal">Novo Produto</h2>

        <!-- FORMULARIO INTERNO COM METADADOS ESPECIFICOS DO PRODUTO -->
        <input type="text" id="nome" placeholder="Nome do produto" />

        <input type="text" id="categoria" placeholder="Categoria" />

        <textarea id="descricao" placeholder="Descrição do produto"></textarea>

        <input type="number" id="preco" step="0.01" placeholder="Preço" />

        <div class="campo">
          <label for="quantidade">Quantidade em Estoque</label>
          <input type="number" id="quantidade" min="0" value="0" />
        </div>

        <div class="campo">
          <label for="estoqueMinimo">Estoque Mínimo</label>
          <input type="number" id="estoqueMinimo" min="0" value="5" />
        </div>

        <select id="status">
          <option value="ativo">Ativo</option>

          <option value="inativo">Inativo</option>
        </select>

        <!-- SELEÇÃO DE BOTOES PARA SALVAMENTO DA OPERAÇÃO OU REJEIÇÃO -->
        <div class="acoes-modal">
          <button id="salvar">Salvar</button>

          <button id="cancelar">Cancelar</button>
        </div>
      </div>
    </div>

    <!-- RODAPE FIXO COM NOTA DE USO RESTRITO ACADEMICO -->
    <footer>
      <p>
        <img
          src="../../Imagens/aviso.png"
          style="width: 24px; height: 24px; vertical-align: middle"
        />
        Esta página foi criada apenas para fins acadêmicos.
      </p>
    </footer>

    <!-- INCLUSÃO DA LOGICA COMPORTAMENTAL BASE DE DADOS E EVENTOS INTERNOS -->
    <script src="../js/alertas.js"></script>
    <script src="../js/produtosDB.js"></script>
    <script src="../js/produtos.js"></script>
  </body>
</html>
