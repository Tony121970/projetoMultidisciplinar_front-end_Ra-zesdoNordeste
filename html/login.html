<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Raízes do Nordeste</title>
    <link rel="stylesheet" href="../css/alertas.css" />
    <link rel="stylesheet" href="../css/login.css" />
  </head>

  <body>
    <!-- CABEÇALHO DO SITE COM IDENTIFICAÇÃO DO SETOR E BOTÃO DE SAÍDA -->
    <header>
      <div class="titulo">
        <h1>Área do Cliente</h1>
        <h2>Seja bem vindo!</h2>
      </div>

      <div class="botoes-header">
        <a href="../index.html" class="btn-header"> Sair </a>
      </div>
    
    </header>

    <!-- BLOCO CENTRAL QUE COMPORTA A CAIXA E O FORMULÁRIO DE AUTENTICAÇÃO -->
    <main>
      <div class="login-box">
        <h2>Fazer Login</h2>

        <!-- FORMULÁRIO QUE ACIONA A FUNÇÃO JAVASCRIPT DE VALIDAÇÃO AO ENVIAR -->
        <form onsubmit="validarLogin(event)">

            <!-- CAMPOS OBRIGATÓRIOS PARA ENTRADA DAS CREDENCIAIS DO USUÁRIO -->
            <label>Usuário</label>
            <input
              type="text"
              id="email"
              placeholder="Digite seu usuário"
              required
            />

            <label>Senha</label>
            <input
              type="password"
              id="senha"
              placeholder="Digite sua senha"
              required
            />
        
          <!-- BOTÃO DISPARADOR PARA ENVIO E VERIFICAÇÃO DOS DADOS -->
          <button type="submit">Entrar</button>

          <!-- ESPAÇO RESERVADO PARA EXIBIR MENSAGEM DE ERRO OU VALIDADO -->
          <p id="mensagem"></p>

          <!-- LINKS ÚTEIS DE NAVEGAÇÃO COMPLEMENTAR PARA O CLIENTE -->
          <div class="links">
            <a href="cadastro.html">Criar conta</a>
            <a href="recuperar-senha.html">Esqueci minha senha</a>
          </div>
        </form>
      </div>
    </main>

    <!-- RODAPÉ PADRÃO DA PÁGINA COM AVISO ACADÊMICO -->
    <footer>
      <p>
        <img
          src="../Imagens/aviso.png"
          style="width: 24px; height: 24px; vertical-align: middle"
        />
        Esta página foi criada apenas para fins acadêmicos.
      </p>
    </footer>

    <!-- INCLUSÃO DOS COMPORTAMENTOS DA TELA E SISTEMA DE ALERTAS EM JAVASCRIPT -->
    <script src="../js/alertas.js"></script>
    <script src="../js/login.js"></script>
  </body>
</html>
