<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar Senha</title>
    <link rel="stylesheet" href="../css/alertas.css" />
    <link rel="stylesheet" href="../css/recuperar-senha.css" />
  </head>

  <body>
    <!-- CABEÇALHO DA PÁGINA CONTENDO LOGO E LINKS DO MENU PRINCIPAL -->
    <header class="header">
      <div class="logo">Raízes do Nordeste</div>

      <nav class="menu">
        <a href="cadastro.html">Cadastro</a>
        <a href="../index.html">Início</a>
      </nav>
    </header>

    <!-- FORMULÁRIO DE REDEFINIÇÃO QUE DISPARA A FUNÇÃO JAVASCRIPT AO ENVIAR -->
    <form onsubmit="redefinirSenha(event)" autocomplete="off">
      <h1>Recuperar Senha</h1>

      <!-- INPUTS DE CREDENCIAIS OBRIGATÓRIAS -->
      <input
        type="email"
        id="email"
        placeholder="E-mail"
        required
        autocomplete="off"
      />
      <input
        type="password"
        id="novaSenha"
        placeholder="Nova senha"
        required
        autocomplete="new-password"
      />

      <!-- DISPARADOR DO ENVIO DOS NOVOS DADOS DE ACESSO -->
      <button type="submit">Redefinir</button>

      <!-- ESPAÇO RESERVADO PARA EXIBIÇÃO DE MENSAGENS DE NOTIFICAÇÃO -->
      <p id="mensagem"></p>
    </form>

    <!-- RODAPÉ INTEGRADO COM AVISO RESTRITO ACADÊMICO -->
    <footer>
      <p>
        <img
          src="../Imagens/aviso.png"
          style="width: 24px; height: 24px; vertical-align: middle"
        />
        Esta página foi criada apenas para fins acadêmicos.
      </p>
    </footer>

    <!-- INCLUSÃO DA LÓGICA DE COMPORTAMENTO -->
    <script src="../js/alertas.js"></script>
    <script src="../js/recuperar-senha.js"></script>
  </body>
</html>
